<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>旅行足迹 & 智能记账</title>
    
    <!-- PWA 配置 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2c4a3e">
    
    <!-- 引入刚刚设计好的山水图标作为 PWA/Tab 图标 -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet 地图 CSS 与 JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f5; overscroll-behavior-y: none; }
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .pulse-marker { width: 18px; height: 18px; background-color: #3b82f6; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(59,130,246,0.6); }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto relative overflow-hidden text-slate-800">

    <!-- 顶部标题栏 -->
    <header class="glass-header z-20 px-4 py-3 flex items-center justify-between border-b border-emerald-900/10 shrink-0">
        <div class="flex items-center space-x-2">
            <img src="icon.png" alt="Icon" class="w-8 h-8 rounded-lg object-cover shadow-sm">
            <h1 class="font-bold text-lg tracking-wide text-emerald-900">旅行足迹 & 记账</h1>
        </div>
        <div id="total-badge" class="text-xs font-semibold bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full shadow-sm">
            总支出: ¥0
        </div>
    </header>

    <!-- 主体区域：地图与记账列表切换 -->
    <main class="flex-1 relative flex flex-col overflow-hidden">
        <!-- 地图容器 -->
        <div id="map" class="absolute inset-0 z-0"></div>

        <!-- 底部浮动面板（账单摘要与快速入口） -->
        <div class="absolute bottom-4 left-4 right-4 z-10 glass-header p-4 rounded-2xl shadow-xl border border-white/40 flex flex-col space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">最近足迹账单</span>
                <button onclick="openModal()" class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs px-4 py-2 rounded-xl font-medium shadow-md transition active:scale-95 flex items-center space-x-1">
                    <span>+ 记一笔</span>
                </button>
            </div>
            <div id="recent-list" class="max-h-28 overflow-y-auto space-y-2 text-xs divide-y divide-slate-100">
                <!-- 动态填充 -->
            </div>
        </div>
    </main>

    <!-- 记账弹窗 -->
    <div id="record-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl transform transition-all animate-in slide-in-from-bottom duration-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-base text-slate-800">记录新足迹与消费</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1">✕</button>
            </div>
            <form id="record-form" onsubmit="handleSave(event)" class="space-y-3 text-sm">
                <div>
                    <label class="block text-xs text-slate-500 mb-1">地点名称</label>
                    <input type="text" id="loc-name" required placeholder="例如：武汉大学东湖绿道" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">分类</label>
                        <select id="loc-category" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="景区/门票">景区/门票</option>
                            <option value="餐饮美食">餐饮美食</option>
                            <option value="交通出行">交通出行</option>
                            <option value="酒店住宿">酒店住宿</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">金额 (元)</label>
                        <input type="number" step="0.01" id="loc-amount" required placeholder="0.00" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">备注说明</label>
                    <input type="text" id="loc-note" placeholder="写点旅行心情..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-3 rounded-xl shadow-lg mt-2 transition active:scale-95">保存记录</button>
            </form>
        </div>
    </div>

    <script>
        // 初始化 LocalStorage 数据
        let records = JSON.parse(localStorage.getItem('travel_records')) || [
            { id: 1, name: '武汉大学', category: '景区/门票', amount: 80, note: '东湖绿道骑行', lat: 30.545, lng: 114.365, date: '2026-06-06' }
        ];

        // 初始化高德/Leaflet 地图 (以武汉为例，可自行调整初始经纬度)
        const map = L.map('map', { zoomControl: false }).setView([30.55, 114.30], 13);
        L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            subdomains: ["1", "2", "3", "4"],
            minZoom: 3,
            maxZoom: 18
        }).addTo(map);

        const markersLayer = L.layerGroup().addTo(map);

        function render() {
            markersLayer.clearLayers();
            let total = 0;
            const listEl = document.getElementById('recent-list');
            listEl.innerHTML = '';

            records.slice().reverse().forEach(item => {
                total += Number(item.amount);

                // 添加地图 Marker
                if(item.lat && item.lng) {
                    const customIcon = L.divIcon({
                        className: 'custom-div-icon',
                        html: '<div class="pulse-marker"></div>',
                        iconSize: [20, 20],
                        iconAnchor: [10, 10]
                    });
                    L.marker([item.lat, item.lng], { icon: customIcon })
                        .bindPopup(`<b>${item.name}</b><br>${item.category}: ¥${item.amount}<br><span class="text-xs text-gray-500">${item.note || ''}</span>`)
                        .addTo(markersLayer);
                }

                // 渲染底部列表
                const row = document.createElement('div');
                row.className = 'flex justify-between items-center py-1';
                row.innerHTML = `
                    <div>
                        <span class="font-semibold text-slate-700">${item.name}</span>
                        <span class="text-[10px] text-slate-400 ml-1">(${item.category})</span>
                    </div>
                    <span class="font-bold text-emerald-700">¥${item.amount}</span>
                `;
                listEl.appendChild(row);
            });

            document.getElementById('total-badge').innerText = `总支出: ¥${total.toFixed(2)}`;
            localStorage.setItem('travel_records', JSON.stringify(records));
        }

        function openModal() { document.getElementById('record-modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('record-modal').classList.add('hidden'); }

        function handleSave(e) {
            e.preventDefault();
            const name = document.getElementById('loc-name').value;
            const category = document.getElementById('loc-category').value;
            const amount = parseFloat(document.getElementById('loc-amount').value);
            const note = document.getElementById('loc-note').value;

            // 默认取当前地图中心点作为经纬度
            const center = map.getCenter();

            records.push({
                id: Date.now(),
                name, category, amount, note,
                lat: center.lat + (Math.random() - 0.5) * 0.01,
                lng: center.lng + (Math.random() - 0.5) * 0.01,
                date: new Date().toISOString().split('T')[0]
            });

            closeModal();
            document.getElementById('record-form').reset();
            render();
        }

        render();
    </script>
</body>
</html>
